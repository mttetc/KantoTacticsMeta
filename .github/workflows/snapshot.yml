name: Refresh API data

# The site is built from data/snapshot: committing a new copy of the API's daily run deploys the day's site.
on:
  schedule:
    - cron: "40 4 * * *" # the API regenerates at 03:40 UTC
    - cron: "40 6 * * *" # GitHub often runs scheduled jobs hours late; a second slot keeps the site same-day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: API run of $(date -u +%F)"
          git push
