<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tier lists and comp guides for Kanto Tactics Ranked, from the game's public Meta API.">
<meta name="theme-color" content="#111216">
<link rel="icon" href="types/psychic.png">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kanto Tactics Meta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: the einoow.com wrapper bar, then the Kanto Tactics lobby (top nav, side panels, big Play) with the in-game Meta panel in the middle. Single dark look, like the game. */
:root{
  --ink:#0a0e1a; --surface:#1a2140; --surface-hi:#232c55; --surface-2:#2a3466; --surface-3:#36428a; --sunk:#0f1430;
  --rim:#96acff80; --rim-soft:#96acff38; --line:#96acff3d; --hi:#ffffff21; --drop:#00000073;
  --txt:#f4f6fb; --dim:#b7c0dc; --gold:#ffd43b; --gold-hi:#ffe066; --gold-deep:#8a5a00; --paper:#f4f1e8;
  --red:#ff6b6b; --green:#69db7c; --blue:#4dabf7; --cobalt:#5f86ef; --orange:#ffa94d; --brand-cobalt:#465bff;
  --tS:#e03131; --tA:#f08c00; --tB:#2f9e44; --tC:#1c7ed6; --tD:#6b7290;
  --c1:#adb5bd; --c2:#69db7c; --c3:#4dabf7; --c4:#cc5de8; --c5:#ffd43b;
  --panel-bg:linear-gradient(180deg,var(--surface-hi),var(--surface) 60%);
  --panel-shadow:inset 0 0 0 1px var(--rim),inset 0 3px 0 0 var(--hi),0 3px 0 var(--drop);
  --card:linear-gradient(180deg,#232c55,#1a2140 60%);
  --font-ui:"Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-site:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#2a2f7a;color:var(--txt);font:17px/1.35 var(--font-ui);padding:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#111216}
button{font:inherit;color:inherit;cursor:pointer}
img{image-rendering:pixelated;user-select:none;-webkit-user-drag:none}
a{color:#a5d8ff;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hidden,[hidden]{display:none!important}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- the game's title-screen background: sky, spinning rays, scrolling perspective grid, stars, vignette ---- */
.title-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(#2a2f7a 0%,#6b3fa0 38%,#f0727a 66%,#ffc46b 100%)}
.title-rays{position:absolute;top:42%;left:50%;width:136vmax;height:136vmax;margin:-68vmax 0 0 -68vmax;
  background:repeating-conic-gradient(#ffffff17 0deg,#ffffff17 7deg,transparent 7deg,transparent 18deg);
  -webkit-mask-image:radial-gradient(93.3vmax,#000 0,transparent 100%);mask-image:radial-gradient(93.3vmax,#000 0,transparent 100%);animation:title-spin 60s linear infinite}
.title-grid{position:absolute;left:-50%;right:-50%;bottom:0;height:42%;overflow:hidden;transform-origin:50% 0;transform:perspective(300px) rotateX(58deg);
  -webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%)}
.title-grid::before{content:"";position:absolute;inset:-64px 0 0;background-image:linear-gradient(#ffffff59 2px,transparent 2px),linear-gradient(90deg,#ffffff59 2px,transparent 2px);background-size:64px 64px;animation:title-grid 1.6s linear infinite}
.title-stars{position:absolute;inset:0 0 40%}
.title-stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.1;animation:title-twinkle var(--t,3s) ease-in-out var(--d,0s) infinite}
.title-vignette{position:absolute;inset:0;background:radial-gradient(transparent 45%,#0000008c)}
@keyframes title-spin{to{transform:rotate(360deg)}}
@keyframes title-grid{from{transform:translateY(0)}to{transform:translateY(64px)}}
@keyframes title-twinkle{0%,100%{opacity:.1;transform:scale(1)}50%{opacity:1;transform:scale(2.6)}}
/* entrance animations, same curves as the game */
@keyframes meta-pop{0%{opacity:0;transform:translateY(24px) scale(.95)}}
@keyframes title-drop{0%{transform:translateY(-60vh) scale(.6)}}
@keyframes title-wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-3deg)}}
@keyframes title-glint{0%,12%,100%{filter:none}6%{filter:brightness(1.35) drop-shadow(0 0 6px #fff8c8e6)}}
@keyframes card-in{0%{opacity:0;transform:translateY(18px) scale(.96)}}
@keyframes lb-swap{0%{opacity:.4;transform:scale(.985)}}
@keyframes ln-in-r{0%{opacity:.3;translate:32px}}
@keyframes ln-in-l{0%{opacity:.3;translate:-32px}}
@keyframes ln-pulse{0%,100%{box-shadow:0 7px #0a0e1a,0 0 14px #ffe06659}50%{box-shadow:0 7px #0a0e1a,0 0 30px #ffe066d9,0 0 0 3px #ffe0668c}}

/* ---- einoow.com top bar ---- */
.sitebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111216;border-bottom:1px solid #ffffff1a;font:14px/1.2 var(--font-site);color:#ffffffe6}
.sitebar .back{display:inline-flex;align-items:center;gap:8px;color:#ffffffe6;text-decoration:none;font-weight:600}
.sitebar .back svg{width:16px;height:16px}
.sitebar .mid{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;white-space:nowrap;pointer-events:none}
.sitebar .acts{display:flex;align-items:center;gap:8px}
.sitebar .btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:8px;font-weight:600;text-decoration:none;white-space:nowrap}
.sitebar .btn.discord{background:var(--brand-cobalt);color:#fff}
.sitebar .btn.x{background:#fff;color:#17181d}
.sitebar .btn.pill{height:36px;border:1px solid #ffffff33;border-radius:9999px;color:#ffffffe6}
.sitebar .btn:hover{opacity:.9}

/* ---- lobby top: chips left, segmented nav centre, search right ---- */
.ln-top{display:flex;align-items:center;gap:16px;min-height:74px;padding-block:8px;background:linear-gradient(#0e1228d1,#0e12288c);flex-wrap:wrap}
.ln-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1 1 220px;animation:ln-in-l .45s cubic-bezier(.2,1.4,.4,1) .1s both}
.ln-live{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:99px;background:#0a0e1a99;border:2px solid #8ce99a8c;font-size:13px;color:#fff;white-space:nowrap}
.ln-live b{color:#8ce99a;font-size:17px}
.ln-live.gold{border-color:#ffe066a6}.ln-live.gold b{color:var(--gold-hi)}
.ln-live i{width:9px;height:9px;border-radius:50%;background:#69db7c;box-shadow:0 0 8px #69db7c}
.ln-nav{display:flex;gap:4px;padding:5px;border-radius:18px;background:#0a0e1a99;border:2px solid #ffffff59;flex:0 0 auto;max-width:100%;overflow-x:auto;scrollbar-width:none;animation:card-in .55s .2s cubic-bezier(.2,1.4,.4,1) both}
.ln-tab{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 16px;border:0;border-radius:13px;background:none;color:#c5cbe0;font-weight:700;font-size:15px;white-space:nowrap}
.ln-tab .n{font-size:.78em;font-weight:600;opacity:.75}
.ln-tab.on{background:linear-gradient(#ffe066,#fcc419 60%,#f59f00);color:#1a1f2e;box-shadow:0 3px 0 var(--gold-deep);font-size:18px;padding:0 22px 0 16px}
.ln-tab.on .n{opacity:.8}
.ln-tab:not(.on):hover{color:#fff;background:#ffffff14}
.ln-search{flex:1 1 220px;display:flex;justify-content:flex-end;animation:ln-in-r .45s cubic-bezier(.2,1.4,.4,1) .1s both}
.mtc-search{width:280px;max-width:100%;font:inherit;font-size:15px;color:inherit;border:2px solid var(--ink);background:#0a0e1a99;border-radius:12px;padding:9px 12px;
  box-shadow:inset 0 2px 0 #00000073,inset 0 0 0 1px var(--rim-soft)}
.mtc-search::placeholder{color:#8f9bbf}

/* ---- lobby grid ---- */
.lobby{display:grid;grid-template-columns:minmax(220px,260px) minmax(0,1fr) minmax(240px,300px);gap:16px;align-items:start;max-width:1500px;margin:14px auto 0}
.side{background:#0a0e1ab8;border:3px solid #ffffff4d;border-radius:18px;padding:12px;box-shadow:0 6px 0 #0a0e1a,0 14px 28px #0000005c;min-width:0}
.side.left{animation:ln-in-l .5s cubic-bezier(.2,1.4,.4,1) .25s both}
.side.right{animation:ln-in-r .5s cubic-bezier(.2,1.4,.4,1) .25s both}
.side h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700}
.side h4 small{text-transform:none;letter-spacing:0;font-weight:500;margin-left:6px;opacity:.8}
.side .blk{background:var(--card);border:2px solid var(--ink);box-shadow:var(--panel-shadow);border-radius:12px;padding:10px;margin-bottom:10px}
.side .blk:last-child{margin-bottom:0}
.side .kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--dim);padding:3px 0;border-bottom:1px solid var(--line)}
.side .kv:last-child{border-bottom:0}
.side .kv b{color:var(--txt);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--dim)}
.legend div{display:flex;align-items:center;gap:8px}
.legend b{color:var(--txt);font-variant-numeric:tabular-nums}
.odds{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.odds th{color:var(--dim);font-weight:600;padding:2px 3px;text-align:right;font-size:12px}
.odds th:first-child,.odds td:first-child{text-align:left}
.odds td{padding:2px 3px;text-align:right;border-top:1px solid var(--line);position:relative}
.odds td i{position:absolute;left:3px;right:3px;bottom:0;height:2px;background:var(--cc);opacity:.85}
.odds .o1{--cc:var(--c1)}.odds .o2{--cc:var(--c2)}.odds .o3{--cc:var(--c3)}.odds .o4{--cc:var(--c4)}.odds .o5{--cc:var(--c5)}
.odds .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cc);box-shadow:0 0 0 1px #0008;vertical-align:middle}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px;background:#0f1430;border:2px solid var(--ink);border-radius:10px;padding:4px 8px 4px 4px;box-shadow:inset 0 2px 0 #00000073,inset 0 0 0 1px #96acff38;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.rank li:hover{background:#151b40}
.rank .num{display:grid;place-items:center;width:34px;height:38px;border-radius:8px;background:linear-gradient(#74c0fc,#1c7ed6 60%,#1257a0);color:#fff;font-weight:700;font-size:20px;text-shadow:0 2px 0 #1257a0,0 0 2px #0a0e1a}
.rank .num.g{background:linear-gradient(#ffe066,#fcc419 60%,#f59f00);color:#1a1f2e;text-shadow:0 1px 0 #ffffff80}
.rank .who{display:flex;flex-direction:column;min-width:0;gap:2px}
.rank .who b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .who .mons{display:flex;gap:2px}
.rank .who .mons img{width:22px;height:22px;object-fit:contain}
.rkc-pill{background:#0a0e1a99;border-radius:999px;box-shadow:inset 0 0 0 1.5px #ffd43bbf;color:#fff3bf;font-size:12px;font-weight:700;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.side .mtc-tier{width:22px;height:22px;font-size:.7em;border-radius:7px}

/* ---- centre: logo + meta panel ---- */
.center{min-width:0}
.title-logo{display:block;text-align:center;line-height:.9;position:relative;animation:title-drop .7s cubic-bezier(.2,1.6,.4,1) both;text-decoration:none;margin:4px auto 10px;width:max-content;max-width:100%}
.tl-kanto{display:block;font-size:clamp(44px,6vw,72px);font-weight:700;letter-spacing:.02em}
.tl-kanto span{display:inline-block;color:var(--gold);-webkit-text-stroke:3px #2a4fa8;paint-order:stroke;
  text-shadow:0 2px #2a4fa8,0 4px #2a4fa8,0 6px #1d3a80,0 8px #1d3a80,0 10px #142a5e,0 14px 18px #00000073;animation:title-wave 2.2s ease-in-out infinite,title-glint 3.2s ease-in-out infinite}
.tl-kanto span:nth-child(2){animation-delay:.1s,.2s}.tl-kanto span:nth-child(3){animation-delay:.2s,.4s}.tl-kanto span:nth-child(4){animation-delay:.3s,.6s}.tl-kanto span:nth-child(5){animation-delay:.4s,.8s}
.tl-tactics{display:inline-block;margin-top:6px;padding:3px 16px 5px;font-size:clamp(16px,2vw,24px);font-weight:700;letter-spacing:.32em;text-indent:.32em;color:#fff;text-shadow:0 2px #6b0b0b;
  background:linear-gradient(#e03131,#a51111);border:3px solid #fff;border-radius:12px;transform:rotate(-2deg);box-shadow:0 5px #6b0b0b,0 10px 20px #0006}
.tl-meta{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 12px;vertical-align:bottom;padding:4px 12px 4px 9px;border-radius:99px;border:2px solid var(--gold-hi);background:linear-gradient(#0e1228eb,#1a2140e0);box-shadow:0 3px 0 #0a0e1acc,0 0 16px #ffe0664d;color:var(--gold-hi);font-weight:700;font-size:16px;transform:rotate(2deg)}
.tl-meta svg{width:18px;height:18px}

.meta-panel{border:4px solid var(--paper);border-radius:20px;overflow:hidden;position:relative;
  box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 6px #0b0e18,0 0 0 3px #0b0e18,0 18px 60px #0009;
  background:linear-gradient(#1b2030fa,#10131efc);animation:meta-pop .32s cubic-bezier(.2,.9,.3,1.25) .15s both}
.meta-head{display:flex;align-items:center;gap:12px;padding:12px 16px 10px 18px;border-bottom:2px solid #ffffff1a;flex-wrap:wrap}
.meta-ico{width:28px;height:28px;color:var(--gold-hi);filter:drop-shadow(0 2px 0 #000);flex:0 0 auto}
.meta-ttl{flex:1 1 220px;min-width:0}
.meta-ttl h1{margin:0;font-size:26px;line-height:1.1;color:var(--gold);text-shadow:0 3px 0 #b8860b;-webkit-text-stroke:1.2px #0b0e18;paint-order:stroke;font-weight:700;text-wrap:balance}
.meta-ttl small{display:block;margin-top:2px;color:#adb5bd;font-size:13px;font-weight:600;line-height:1.3}
.meta-body{padding:12px 14px 16px}
#view{animation:lb-swap .28s ease-out both}
.tier-row,.mtc-card{animation:card-in .55s var(--d,.25s) cubic-bezier(.2,1.4,.4,1) both}
#view.no-anim,#view.no-anim *:not(.mtc-detail){animation:none!important}
.mtc-detail{animation:detail-in .22s ease-out both}
@keyframes detail-in{0%{opacity:0;transform:translateY(-6px)}}

/* chips & sort */
.mtc-sort{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;font-size:.84em;color:var(--dim)}
.mtc-sort .lbl{margin-right:2px}
.mtc-sort .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.chip{border:1px solid var(--line);background:#00000033;border-radius:99px;padding:5px 12px;font-weight:600;color:var(--dim);display:inline-flex;align-items:center;gap:5px;min-height:32px}
.chip.on{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.chip img{width:14px;height:14px}
.chip.cost{--cc:var(--c1)}
.chip.cost::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--cc);box-shadow:0 0 0 1px #0008}

/* tier rows */
.tiers{display:flex;flex-direction:column;gap:8px}
.tier-row{display:grid;grid-template-columns:60px minmax(0,1fr);background:var(--card);border:2px solid var(--ink);box-shadow:var(--panel-shadow);border-radius:14px;overflow:hidden}
.tier-row .tier-cell{display:grid;place-items:center;padding:10px 6px;border-right:1px solid var(--line);background:#00000022}
.tier-row .tier-body{display:flex;flex-wrap:wrap;gap:10px 6px;padding:10px 10px;min-width:0;align-content:flex-start}
.tier-row .tier-body:empty::after{content:"Nothing here with this filter";color:var(--dim);font-size:.85em;padding:4px 2px}
.mtc-tier{display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--ink);border-radius:8px;color:#fff;font-weight:700;font-size:.8em;line-height:1}
.mtc-tier.big{width:46px;height:46px;border-radius:12px;font-size:1.5em;box-shadow:inset 0 2px 0 #ffffff4d,0 2px 0 var(--drop)}
.mtc-tier.tS{background:var(--tS)}.mtc-tier.tA{background:var(--tA)}.mtc-tier.tB{background:var(--tB)}.mtc-tier.tC{background:var(--tC)}.mtc-tier.tD{background:var(--tD)}
.tier-note{color:var(--dim);font-size:.78em;margin:6px 2px 0}

/* unit cards */
.mtc-unit{display:flex;flex-direction:column;align-items:center;width:94px;background:none;border:0;padding:0;border-radius:12px;position:relative}
.mtc-unit small{width:100%;text-align:center;color:var(--dim);font-size:.74em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mtc-unit .avg{font-size:.86em;font-weight:700;color:var(--txt);line-height:1;margin-top:3px}
.mtc-unit:hover .mtc-mon,.mtc-unit.sel .mtc-mon{box-shadow:0 0 0 2px var(--gold)}
.tier-body .mtc-unit .mtc-mon{width:70px;height:70px;border-radius:16px}
.tier-body>*{animation:card-in .55s var(--d,.2s) cubic-bezier(.2,1.4,.4,1) both}
.mtc-stars{display:block;height:13px;line-height:13px;font-size:11px;letter-spacing:-1px;color:var(--gold);text-align:center}
.mtc-mon{display:grid;place-items:center;width:44px;height:44px;object-fit:contain;border:2px solid var(--cc,var(--ink));background:#00000040;border-radius:10px;position:relative}
.mtc-mon>img{width:100%;height:100%;object-fit:contain;border-radius:inherit}
.mtc-mon.unknown{color:var(--dim);border-style:dashed;border-color:var(--line);font-weight:700;font-size:.8em}
.mtc-mon.c1{--cc:var(--c1)}.mtc-mon.c2{--cc:var(--c2)}.mtc-mon.c3{--cc:var(--c3)}.mtc-mon.c4{--cc:var(--c4)}.mtc-mon.c5{--cc:var(--c5)}
.mtc-mon.c4{box-shadow:0 0 8px #cc5de873}.mtc-mon.c5{box-shadow:0 0 12px #fcc41999}
.mtc-mon.sm{width:42px;height:42px;border-radius:11px;border-width:2px}
.mtc-mon.sm.c4,.mtc-mon.sm.c5{box-shadow:none}
.mtc-items{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);display:flex;gap:1px;z-index:3;filter:drop-shadow(0 1px 0 #0a0e1a)}
.it-ico{display:block;width:20px;height:20px;background:var(--surface);border:1px solid var(--ink);border-radius:5px;flex:0 0 auto}
.mtc-items .it-ico{width:20px;height:20px}
/* reserve the overhang so rows stay aligned whether or not a unit carries items */
.mtc-row-units{align-items:flex-start;padding-bottom:6px}
.mtc-units .mtc-unit>small:first-of-type{margin-top:10px}
.mtc-mini{display:flex;flex-direction:column;align-items:center;position:relative}
.mtc-mini.fresh .mtc-mon{box-shadow:0 0 0 2px #8ce99a}
/* carry highlight */
.mtc-mini.holder .mtc-mon,.mtc-unit.holder .mtc-mon{box-shadow:0 0 0 2px var(--gold)}
.mtc-mini.carry .mtc-mon,.mtc-unit.carry .mtc-mon{box-shadow:0 0 0 3px var(--gold),0 0 16px #ffd43bb3;border-color:var(--gold-hi)}
.carry-tag{position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(-4deg);z-index:2;background:linear-gradient(#ffe066,#fcc419);color:#1a1f2e;border:1.5px solid var(--ink);border-radius:99px;padding:0 6px;font-size:9px;font-weight:700;letter-spacing:.06em;line-height:14px;white-space:nowrap;box-shadow:0 2px 0 #0a0e1a}
.mtc-units .carry-tag{font-size:10px;line-height:16px;top:-9px}
.carry-tag.sub{background:linear-gradient(#e3e9f0,#aeb9c7);color:#1a1f2e}
.mtc-mini.sub .mtc-mon,.mtc-unit.sub .mtc-mon{box-shadow:0 0 0 3px #c9d3e0,0 0 12px #c9d3e080;border-color:#e3e9f0}
.mtc-carries li.sub>b{color:#e3e9f0}
/* seals catalogue */
.seal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.seal{--rc:#adb5bd;display:flex;flex-direction:column;gap:4px;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;box-shadow:var(--panel-shadow),inset 0 0 0 2px color-mix(in srgb,var(--rc) 55%,transparent);min-width:0;animation:card-in .5s var(--d,.2s) cubic-bezier(.2,1.4,.4,1) both}
.seal.r2{--rc:#4dabf7}.seal.r3{--rc:#ffd43b;box-shadow:var(--panel-shadow),inset 0 0 0 2px #ffd43b8c,0 0 14px #ffd43b40}
.seal-head{display:flex;align-items:center;gap:8px;min-width:0}
.seal-head b{font-size:1em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.seal-code{font-size:.7em;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-variant-numeric:tabular-nums}
.seal-rar{font-size:.68em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1a1f2e;background:var(--rc);border-radius:99px;padding:1px 7px}
.seal .line{font-size:.92em;line-height:1.35}
.seal .det{font-size:.8em;color:var(--dim);line-height:1.4}
.seal .cat{display:inline-flex;align-items:center;gap:4px;font-size:.72em;color:var(--dim);margin-top:auto;padding-top:4px}
.seal .cat .mtc-mon{width:26px;height:26px;border-radius:7px}
.seal-h{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-size:1.05em}
.seal-h small{color:var(--dim);font-weight:500}
.seal-h:first-child{margin-top:0}
.mtc-row-units .mtc-mini.carry{margin:0 4px}
.mtc-row-units .mtc-mini.carry .mtc-mon{width:54px;height:54px}
.mtc-row-units .mtc-items .it-ico{width:18px;height:18px}
.mtc-row-units .mtc-mini.carry .mtc-items .it-ico{width:22px;height:22px}
.key-items{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.key-item{display:inline-flex;align-items:center;gap:6px;background:#0a0e1a99;border:2px solid var(--gold);border-radius:99px;padding:2px 10px 2px 3px;font-size:.84em;font-weight:600;box-shadow:0 0 12px #ffd43b59}
.key-item .it-ico{width:30px;height:30px;border-radius:9px}
.key-item i{font-style:normal;color:var(--dim);font-weight:500}
.key-item .mtc-mon{width:22px;height:22px;border-radius:6px;border-width:1.5px}

/* detail popover for a Pokémon / item / type */
.detail{background:var(--card);border:2px solid var(--ink);box-shadow:var(--panel-shadow),0 0 0 2px var(--cobalt);border-radius:14px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;position:relative}
.detail .big{width:84px;height:84px;border-radius:16px}
.detail .big img{width:100%;height:100%}
.detail h3{margin:0 0 4px;font-size:1.15em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail p{margin:4px 0;color:var(--dim);font-size:.92em;line-height:1.45}
.detail p b{color:var(--txt)}
.mtc-stats{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:6px}
.mtc-stat{display:flex;flex-direction:column;min-width:66px}
.mtc-stat b{font-size:1.3em;line-height:1.1;font-variant-numeric:tabular-nums}
.mtc-stat span{color:var(--dim);font-size:.76em}
.mtc-stat small{color:var(--dim);opacity:.8;font-size:.72em}
.mtc-bar{display:block;width:66px;height:4px;border-radius:4px;background:#00000059;overflow:hidden;margin-top:2px}
.mtc-bar i{display:block;height:100%;border-radius:4px;background:var(--cobalt)}
.mtc-trait{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#00000040;border-radius:99px;padding:2px 9px;font-size:.8em;font-weight:600}
.mtc-trait img{width:15px;height:15px}
.mtc-btn{background:linear-gradient(180deg,var(--surface-3),var(--surface-2) 55%);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--rim-soft),inset 0 2px 0 var(--hi),0 2px 0 var(--drop);border-radius:10px;padding:7px 14px;font-weight:600;white-space:nowrap}
.mtc-btn:active{transform:translateY(1px)}
.mtc-btn.go{color:var(--ink);background:linear-gradient(#ffe066,#fcc419)}
.mtc-btn.x{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:20px;border-radius:10px}

/* comps list, like the game */
.mtc-list{display:flex;flex-direction:column;gap:8px}
.mtc-card{background:var(--card);border:2px solid var(--ink);box-shadow:var(--panel-shadow);border-radius:14px;overflow:hidden}
.mtc-card.exp{box-shadow:var(--panel-shadow),0 0 0 2px var(--cobalt)}
.mtc-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto 14px;align-items:center;gap:10px;width:100%;padding:10px 10px;text-align:left;background:none;border:0}
.mtc-row:hover{background:#ffffff08}
.mtc-row .mtc-tier{width:32px;height:32px;border-radius:9px;font-size:1em}
.mtc-row-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.mtc-row-title{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.mtc-row-title h3{margin:0;font-size:1em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtc-pop{display:inline-flex;align-items:center;gap:3px;color:var(--ink);border:1px solid var(--ink);background:#ffc078;border-radius:99px;padding:1px 8px 1px 6px;font-size:.74em;font-weight:700}
.mtc-fewtag{border:1px dashed var(--line);color:var(--dim);border-radius:99px;padding:1px 8px;font-size:.74em}
.mtc-row-units{display:flex;gap:3px;flex-wrap:wrap;align-items:flex-end}
.mtc-row-avg{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.mtc-row-avg b{font-size:1.3em;font-variant-numeric:tabular-nums}
.mtc-row-avg small{color:#cfd6ee;font-size:.76em;white-space:nowrap}
.mtc-row-chev{color:var(--dim);font-size:.8em}
.mtc-detail{border-top:2px solid var(--line);background:#0000002e;padding:12px;display:flex;flex-direction:column;gap:14px}
.mtc-sec{background:var(--card);border:2px solid var(--ink);box-shadow:var(--panel-shadow);border-radius:14px;padding:12px;min-width:0}
.mtc-h4{margin:0 0 8px;font-size:1em}
.mtc-h4 small{color:var(--dim);font-weight:500;margin-left:6px}
.mtc-units{display:flex;flex-wrap:wrap;gap:8px}
.mtc-units .mtc-unit{width:76px}
.mtc-units .mtc-mon{width:66px;height:66px;border-radius:15px}
.mtc-units .mtc-unit.carry{width:92px}
.mtc-units .mtc-unit.carry .mtc-mon{width:80px;height:80px;border-radius:18px}
.mtc-units .mtc-items .it-ico{width:24px;height:24px;border-radius:6px}
.mtc-units .mtc-unit.carry .mtc-items .it-ico{width:28px;height:28px;border-radius:7px}
.mtc-carries{list-style:none;margin:10px 0 0;padding:8px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:.88em}
.mtc-carries li{display:grid;grid-template-columns:190px minmax(0,1fr);align-items:center;gap:6px 10px;padding:3px 0;border-bottom:1px solid #96acff1f}
.mtc-carries li:last-child{border-bottom:0}
.mtc-carries li>b{display:inline-flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtc-carries li.carry>b{color:var(--gold-hi)}
.mtc-carry-its{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;color:var(--dim)}
.mtc-carry-its span{display:inline-flex;align-items:center;gap:5px;min-width:0;white-space:nowrap}
.mtc-carry-its span i{margin-left:auto;padding-left:6px}
.mtc-carry-its span.key{color:var(--txt);font-weight:600}
.mtc-carry-its span.key .it-ico{box-shadow:0 0 0 2px var(--gold)}
.mtc-carry-its .it-ico{width:22px;height:22px}
.mtc-carry-its i{font-style:normal;opacity:.7;font-size:.85em}
.mtc-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.mtc-board{text-align:center;max-width:440px;margin:0 auto}
.mtc-board svg{width:100%;height:auto;display:block}
.mtc-board polygon{fill:#00000040;stroke:var(--line);stroke-width:1.5}
.mtc-board polygon.on{fill:#5f86ef2e;stroke:var(--cobalt)}
.mtc-board polygon.carry{fill:#ffd43b2e;stroke:var(--gold)}
.mtc-board text{fill:#fff;paint-order:stroke;stroke:var(--ink);stroke-width:3px;font-size:10px;font-weight:700;font-family:var(--font-ui)}
.mtc-board-rival{color:#ff8787;font-size:.76em;font-weight:700;margin-bottom:4px}
.mtc-board-rival span{color:var(--dim);font-weight:500}
.mtc-levels{display:flex;flex-direction:column}
.mtc-level{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mtc-level:last-child{border-bottom:0}
.mtc-level>div:first-child{color:var(--dim);font-size:.8em}
.mtc-level>div:first-child b{display:block;color:var(--txt);font-size:1.1em}
.mtc-strip{display:flex;flex-wrap:wrap;gap:4px}
.mtc-legend-new{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:.8em;margin-top:8px}
.mtc-legend-new i{display:block;width:12px;height:12px;border-radius:4px;box-shadow:0 0 0 2px #8ce99a}
.mtc-variant{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--dim);font-size:.88em;padding:6px 0;border-bottom:1px solid var(--line)}
.mtc-variant:last-child{border-bottom:0}
.mtc-variant b{color:var(--txt)}
.mtc-note{color:var(--dim);opacity:.85;font-size:.78em;margin:8px 0 0}
.more-wrap{display:flex;justify-content:center;margin-top:12px}

/* item + type cards in tier rows */
.it-card{display:flex;flex-direction:column;align-items:center;width:92px;background:none;border:0;padding:0;border-radius:10px}
.it-card .it-ico{width:68px;height:68px;border-radius:16px;border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--rim-soft);padding:5px}
.it-card:hover .it-ico,.it-card.sel .it-ico{box-shadow:0 0 0 2px var(--gold)}
.it-card small{width:100%;text-align:center;color:var(--dim);font-size:.74em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.it-card .avg{font-size:.86em;font-weight:700;line-height:1;margin-top:3px}
.ty-card{display:flex;flex-direction:column;align-items:center;width:98px;background:none;border:0;padding:0;border-radius:10px}
.ty-card .ty-ico{width:62px;height:62px;border-radius:14px;border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--rim-soft);background:var(--surface);display:grid;place-items:center}
.ty-card .ty-ico img{width:100%;height:100%;border-radius:8px}
.ty-card:hover .ty-ico,.ty-card.sel .ty-ico{box-shadow:0 0 0 2px var(--gold)}
.ty-card small{width:100%;text-align:center;color:var(--dim);font-size:.74em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.ty-card .lvl{font-size:.86em;font-weight:700;line-height:1;margin-top:3px}
.recipe{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.recipe .it-ico{width:24px;height:24px}
.recipe .plus{color:var(--dim);font-weight:700}

/* big play, like the lobby */
.big-play{display:flex;align-items:center;justify-content:center;gap:14px;max-width:1500px;margin:16px auto 0;min-height:72px;border-radius:22px;text-decoration:none;color:#1a1f2e;font-size:clamp(24px,3.4vw,36px);font-weight:700;
  background:linear-gradient(#ffe066,#fcc419 60%,#f59f00);border:4px solid #0a0e1a;box-shadow:0 7px #0a0e1a,0 0 14px #ffe06659;animation:ln-pulse 1.6s ease-in-out infinite,card-in .55s .45s cubic-bezier(.2,1.4,.4,1) both}
.big-play:hover{filter:brightness(1.04)}
.big-play:active{transform:translateY(3px);box-shadow:0 3px #0a0e1a}
.big-play svg{width:.9em;height:.9em}
.lobby-foot{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:flex-end;align-items:center;max-width:1500px;margin:10px auto 0;padding-bottom:14px;color:#1b1f4ac7;text-shadow:0 1px 0 #ffffff59;font-size:12px;line-height:1.5}
.lobby-foot a{color:#1b1f4ac7;font-weight:600;text-decoration:underline}
.loading{color:var(--dim);padding:30px;text-align:center}
.err{background:#ffd43b1f;border:1px solid #ffd43b80;border-radius:10px;padding:10px 12px;font-size:.9em}
.mtc-fewtag.core{border-style:solid;color:#ffe066;border-color:#ffe06666}
.mtc-row-units .mtc-mini.dim .it-ico{opacity:.55}

/* ---- modal: the game's meta veil + panel ---- */
dialog.meta-veil{border:0;padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0;inset:0;color:var(--txt);font:17px/1.35 var(--font-ui);overflow:auto;place-items:center}
dialog.meta-veil[open]{display:grid}
dialog.meta-veil::backdrop{background:#05070eb8;backdrop-filter:blur(3px);animation:meta-fade .2s ease-out}
@keyframes meta-fade{0%{opacity:0}}
.modal-panel{width:min(780px,100%);max-height:100%;overflow:auto;border:4px solid var(--paper);border-radius:20px;overscroll-behavior:contain;
  box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 6px #0b0e18,0 0 0 3px #0b0e18,0 18px 60px #0009;background:linear-gradient(#1b2030fa,#10131efc);animation:meta-pop .32s cubic-bezier(.2,.9,.3,1.25)}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 16px;border-bottom:2px solid #ffffff1a;position:sticky;top:0;background:#1b2030f5;z-index:1}
.modal-head h2{flex:1;min-width:0;margin:0;color:var(--gold);text-shadow:0 3px #b8860b;-webkit-text-stroke:1.2px #0b0e18;paint-order:stroke;font-size:24px;line-height:1.1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal-head h2 .mtc-tier{-webkit-text-stroke:0;text-shadow:none}
.meta-x{width:44px;height:44px;flex:0 0 auto;border:2px solid #ffffff4d;border-radius:12px;background:#ffffff14;color:#fff;font-size:22px;font-weight:700;box-shadow:0 3px #00000080;display:grid;place-items:center}
.meta-x:hover{background:#ffffff29}
.modal-body{padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
.modal-body .detail{margin:0;box-shadow:var(--panel-shadow)}
.rel{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rel li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;background:#0f1430;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;box-shadow:inset 0 2px 0 #00000073,inset 0 0 0 1px #96acff38;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.rel li:hover{background:#151b40}
.rel .who{display:flex;flex-direction:column;min-width:0;gap:3px}
.rel .who b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .mons{display:flex;gap:2px;flex-wrap:wrap}
.rel .mons img{width:24px;height:24px;object-fit:contain}
.held{display:flex;flex-wrap:wrap;gap:6px}
.held span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#00000040;border-radius:99px;padding:3px 10px 3px 4px;font-size:.88em;font-weight:600}
.held .it-ico{width:24px;height:24px;border-radius:7px}
.held i{font-style:normal;color:var(--dim);font-weight:500}

@media (max-width:1100px){
  .lobby{grid-template-columns:minmax(0,1fr)}
  .side.left{order:3}.side.right{order:2}.center{order:1}
  .sitebar .mid{display:none}
}
@media (max-width:640px){
  .tier-row{grid-template-columns:46px minmax(0,1fr)}
  .mtc-tier.big{width:36px;height:36px;font-size:1.1em;border-radius:10px}
  .mtc-unit{width:76px}
  .tier-body .mtc-unit .mtc-mon{width:56px;height:56px}
  .mtc-mon.sm{width:36px;height:36px}
  .ln-tab{height:42px;padding:0 12px;font-size:14px}.ln-tab.on{font-size:15px;padding:0 14px}
  .ln-nav{order:3;flex:1 1 100%;justify-content:flex-start}
  .ln-search{order:2;flex:1 1 120px}.mtc-search{width:100%}
  .mtc-row{grid-template-columns:28px minmax(0,1fr) auto 12px;gap:8px;padding:8px}
  .mtc-carries li{grid-template-columns:minmax(0,1fr)}
  .sitebar .btn.x span{display:none}
  .sitebar .back span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<dialog class="meta-veil" id="modal" aria-labelledby="modalTitle">
  <div class="modal-panel">
    <header class="modal-head"><h2 id="modalTitle"></h2><button class="meta-x" id="modalClose" aria-label="Close">×</button></header>
    <div class="modal-body" id="modalBody"></div>
  </div>
</dialog>

<script>
(() => {
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt1 = n => n == null ? '–' : n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = n => n == null ? '–' : (Math.round(n*10)/10).toLocaleString('en-US') + ' %';
const int = n => n == null ? '–' : n.toLocaleString('en-US');
const TIERS = ['S','A','B','C','D'];
const TIER_HELP = {S:'well below the reference place', A:'below the reference', B:'around the reference', C:'above the reference', D:'well above the reference'};
const D_GAP = 0.5; // the API stops at C; D mirrors S on the other side: avg ≥ ref + 0.5
const tierOf = x => (x.tier === 'C' && x.avg >= KT.meta.ref + D_GAP) ? 'D' : x.tier;
// comps: stricter than the game. Score = avg + CI (pessimistic), so small or noisy samples drop.
const COMP_T = {S: -0.8, A: -0.15, B: 0.6, C: 1.2};
const compTier = c => { const sc = c.avg + (c.ic || 0) - KT.meta.ref; return sc <= COMP_T.S ? 'S' : sc <= COMP_T.A ? 'A' : sc <= COMP_T.B ? 'B' : sc <= COMP_T.C ? 'C' : 'D'; };

let KT = null;
const state = { tab: 'pokemon', q: '', sort: 'avg', cost: 0, type: '', tierFilter: '', compSort: 'avg', shown: 40, sel: null, open: null, reliable: true, modal: null, sealRar: 0, sealCat: '' };
const MIN_NE = 30; // below this many effective games the API gives only the 4-unit core: no stars, no shares, global items
const isCore = c => c.units.some(u => u.share == null);
const reliable = c => c.ne >= MIN_NE && !isCore(c);
const saved = (() => { try { return JSON.parse(localStorage.getItem('kt-meta-ui') || '{}'); } catch (e) { return {}; } })();
const save = () => { try { localStorage.setItem('kt-meta-ui', JSON.stringify({tab: state.tab})); } catch (e) {} };

// ---- data helpers ----
const line = id => KT.lines[id] || {c:null, t:[], n:[id], s:[], stars:[{name:id, dex:null}]};
const lineName = id => { const l = line(id); return l.n[l.n.length-1]; };
const unitName = (id, star) => { const l = line(id); const st = l.stars[Math.min(Math.max((star||1)-1,0), l.stars.length-1)]; return st ? st.name : lineName(id); };
const unitDex = (id, star) => { const l = line(id); const st = l.stars[Math.min(Math.max((star||1)-1,0), l.stars.length-1)]; return st ? st.dex : null; };
const lineDex = id => { const l = line(id); return l.s[l.s.length-1] || null; };
const itemName = id => (KT.itemData[id] || {}).name || id;
const typeName = t => (KT.traitData[t] || {}).name || t;
const stars = n => '★'.repeat(Math.max(1, Math.min(3, n || 1)));

function monHtml(id, {star=null, size='', anim=true, cls='', items=null}={}) {
  const l = line(id);
  const dex = star ? unitDex(id, star) : lineDex(id);
  const cost = l.c ? 'c' + l.c : '';
  const name = star ? unitName(id, star) : lineName(id);
  let inner;
  if (dex) inner = `<img src="${anim ? 'sd/'+dex+'.gif' : 'thumb/'+dex+'.webp'}" alt="${esc(name)}" loading="lazy" width="44" height="44">`;
  else inner = esc(name.slice(0,3).toUpperCase());
  const its = items && items.length ? `<span class="mtc-items">${items.map(i => itemIco(i)).join('')}</span>` : '';
  return `<span class="mtc-mon ${size} ${cost} ${dex ? '' : 'unknown'} ${cls}" title="${esc(name)}">${inner}${its}</span>`;
}
const itemIco = (id, cls='it-ico') => `<img class="${cls}" src="items/${esc(id)}.png" alt="${esc(itemName(id))}" title="${esc(itemName(id))}" loading="lazy" width="18" height="18">`;
const typeGlyph = t => `<img src="types/${esc(t)}-g.png" alt="" width="14" height="14">`;
const tierBadge = (t, big=false) => `<span class="mtc-tier t${esc(t)} ${big?'big':''}">${esc(t)}</span>`;
const compTitle = c => `${esc(typeName(c.name.trait))} · ${c.name.units.map(u => esc(lineName(u))).join(' & ')}`;
const compUnitsNames = c => c.units.map(u => unitName(u.line, u.star)).join(' ');

// carry = the unit that holds the most items (sum of item shares); other item holders are secondary
function carryInfo(c) {
  if (isCore(c)) return {main: null, sub: null, holders: new Set(), keyItems: []};
  const scored = c.units.map(u => ({u, s: (u.items||[]).reduce((a, i) => a + i.share, 0)})).filter(x => x.s > 0).sort((a, b) => b.s - a.s || b.u.share - a.u.share);
  const main = scored[0] ? scored[0].u.line : null;
  const sub = scored[1] && scored[1].s >= 30 ? scored[1].u.line : null; // second most geared unit, if it is geared often enough
  const holders = new Set(scored.filter(x => x.u.line === main || x.u.line === sub || Math.max(...x.u.items.map(i => i.share)) >= 20).map(x => x.u.line));
  const keyItems = [];
  for (const x of scored) for (const i of x.u.items) keyItems.push({id: i.id, line: x.u.line, star: x.u.star, share: i.share, w: i.share * (x.u.share/100)});
  keyItems.sort((a, b) => b.w - a.w);
  return {main, sub, holders, keyItems: keyItems.slice(0, 3)};
}

// ---- side panels & chips ----
function renderShell() {
  const m = KT.meta;
  const games = Math.round(m.seats / 8);
  $('#subtitle').textContent = `What is winning in Ranked right now · ${m.from} to ${m.to} · rules v${m.rules}`;
  $('#chips').innerHTML = `
    <span class="ln-live gold" title="Game rules version in this window">🏆 <b>Rules v${m.rules}</b> Ranked</span>
    <span class="ln-live"><i></i><b>${int(games)}</b> games · 7 days</span>`;
  $('#n-pokemon').textContent = KT.units.length;
  $('#n-comps').textContent = KT.comps.length;
  $('#n-items').textContent = KT.items.length;
  $('#n-types').textContent = KT.traits.length;
  $('#n-seals').textContent = Object.keys(KT.seals || {}).length;
  const gen = new Date(m.generated);
  const p = KT.pvp;
  const levels = Object.keys(p.odds).map(Number).sort((a,b)=>a-b).filter(l => l >= 3);
  $('#sideLeft').innerHTML = `
    <h4>Snapshot<small>${esc(m.from)} → ${esc(m.to)}</small></h4>
    <div class="blk">
      <div class="kv"><span>Player seats</span><b>${int(m.seats)}</b></div>
      <div class="kv"><span>≈ Games (8 players)</span><b>${int(games)}</b></div>
      <div class="kv"><span>Reference place</span><b>${fmt1(m.ref)}</b></div>
      ${m.versions.map(v => `<div class="kv"><span>Rules v${v.rules} <small>${esc(v.from)}${v.from!==v.to?' → '+esc(v.to):''}</small></span><b>${int(v.n)}</b></div>`).join('')}
      <div class="kv"><span>Generated</span><b>${gen.toISOString().slice(0,10)}</b></div>
    </div>
    <h4>Tiers<small>average place vs. reference</small></h4>
    <div class="blk legend">
      <div>${tierBadge('S')} <span>≤ <b>${fmt1(m.ref + m.thresholds.tiers.S)}</b> · ${TIER_HELP.S}</span></div>
      <div>${tierBadge('A')} <span>≤ <b>${fmt1(m.ref + m.thresholds.tiers.A)}</b> · ${TIER_HELP.A}</span></div>
      <div>${tierBadge('B')} <span>≤ <b>${fmt1(m.ref + m.thresholds.tiers.B)}</b> · ${TIER_HELP.B}</span></div>
      <div>${tierBadge('C')} <span>&lt; <b>${fmt1(m.ref + D_GAP)}</b> · ${TIER_HELP.C}</span></div>
      <div>${tierBadge('D')} <span>≥ <b>${fmt1(m.ref + D_GAP)}</b> · ${TIER_HELP.D}</span></div>
      <p class="mtc-note" style="margin:4px 0 0">Pokémon, items, types: the game's tiers (the API stops at C; D is this page's split, mirroring S). <b style="color:var(--txt)">Comps</b> are graded stricter, on the pessimistic average (avg + CI) against the reference: S ≤ ${fmt1(m.ref + COMP_T.S)}, A ≤ ${fmt1(m.ref + COMP_T.A)}, B ≤ ${fmt1(m.ref + COMP_T.B)}, C ≤ ${fmt1(m.ref + COMP_T.C)}, D above. A noisy sample cannot be S.</p>
    </div>
    <h4>Shop odds<small>% per slot, by level</small></h4>
    <div class="blk">
      <table class="odds"><thead><tr><th>Lv</th>${[1,2,3,4,5].map(c => `<th class="o${c}"><span class="dot"></span></th>`).join('')}</tr></thead>
      <tbody>${levels.map(l => `<tr><td><b>${l}</b></td>${p.odds[l].map((o,i) => `<td class="o${i+1}">${o ? o : '<span style="opacity:.35">–</span>'}<i style="width:${o}%"></i></td>`).join('')}</tr>`).join('')}</tbody></table>
      <p class="mtc-note" style="margin:6px 0 0">Pool: ${[1,2,3,4,5].map(c => `<b style="color:var(--c${c})">${p.pool[c]}</b>`).join(' · ')} copies per Pokémon by cost. Reroll ${p.rerollCost} gold. A cost 4 carry is 12 % per slot at level 7, 26 % at level 8, when cost 5 appears.</p>
    </div>`;
  $('#foot').innerHTML = `<span>Data: <a href="https://einoow.com/api/meta/kanto/" target="_blank" rel="noopener">Kanto Tactics Meta API</a>, Ranked, humans only · Unofficial fan page, not affiliated with Nintendo, Creatures or GAME FREAK · Sprites and icons belong to the game</span><a href="https://einoow.com/kanto-tactics/changelog" target="_blank" rel="noopener">Changelog</a><a href="https://discord.gg/Z6VCz2F3TN" target="_blank" rel="noopener">Discord</a>`;
  renderRight();
}
function renderRight() {
  const pool = KT.comps.filter(reliable);
  const top = [...pool].sort((a, b) => a.avg - b.avg).slice(0, 8);
  const played = [...pool].sort((a, b) => b.use - a.use).slice(0, 5);
  const mons = [...KT.units].sort((a, b) => a.avg - b.avg).slice(0, 5);
  const row = (c, i, val, lbl) => `<li role="button" tabindex="0" data-goto-comp="${esc(c.id)}">
      <span class="num ${i===0?'g':''}">${i+1}</span>
      <span class="who"><b>${tierBadge(c.tier)} ${compTitle(c)}</b><span class="mons">${c.units.slice(0,8).map(u => `<img src="thumb/${unitDex(u.line,u.star)||0}.webp" alt="" title="${esc(unitName(u.line,u.star))}" loading="lazy">`).join('')}</span></span>
      <span class="rkc-pill" title="${lbl}">${val}</span></li>`;
  $('#sideRight').innerHTML = `
    <h4>👑 Best comps<small>avg place</small></h4>
    <ul class="rank">${top.map((c, i) => row(c, i, fmt1(c.avg), 'average place')).join('')}</ul>
    <h4 style="margin-top:12px">🔥 Most played<small>usage</small></h4>
    <ul class="rank">${played.map((c, i) => row(c, i, pct(c.use), 'usage')).join('')}</ul>
    <h4 style="margin-top:12px">⭐ Best Pokémon<small>avg place</small></h4>
    <ul class="rank">${mons.map((u, i) => `<li role="button" tabindex="0" data-goto-unit="${esc(u.line)}">
      <span class="num ${i===0?'g':''}">${i+1}</span>
      <span class="who" style="flex-direction:row;align-items:center;gap:8px">${monHtml(u.line,{size:'sm',anim:false})}<b>${esc(lineName(u.line))}</b></span>
      <span class="rkc-pill">${fmt1(u.avg)}</span></li>`).join('')}</ul>`;
}

function matches(q, ...strs) { if (!q) return true; const s = strs.join(' ').toLowerCase(); return q.split(/\s+/).every(w => s.includes(w)); }

function statsHtml(x, max) {
  return `<div class="mtc-stats">
    <div class="mtc-stat"><b>${fmt1(x.avg)}</b><span>avg place</span><small>± ${fmt1(x.ic)}</small></div>
    <div class="mtc-stat"><b>${pct(x.top4)}</b><span>top 4</span><i class="mtc-bar"><i style="width:${x.top4||0}%"></i></i></div>
    <div class="mtc-stat"><b>${pct(x.win)}</b><span>wins</span><i class="mtc-bar"><i style="width:${(x.win||0)}%"></i></i></div>
    <div class="mtc-stat"><b>${pct(x.use)}</b><span>usage</span><i class="mtc-bar"><i style="width:${Math.min(100,(x.use||0)/(max||10)*100)}%"></i></i></div>
    <div class="mtc-stat"><b>${int(x.n)}</b><span>games</span><small>${int(x.ne)} effective</small></div>
  </div>`;
}
function sortBy(list, key) { const asc = key === 'avg'; return [...list].sort((a, b) => asc ? a[key] - b[key] : b[key] - a[key]); }

// --- Pokémon tier list ---
function viewPokemon() {
  const q = state.q.toLowerCase();
  const types = Object.keys(KT.traitData);
  const maxUse = Math.max(...KT.units.map(u => u.use));
  let units = KT.units.filter(u => matches(q, lineName(u.line), ...line(u.line).n, ...line(u.line).t.map(typeName)));
  if (state.cost) units = units.filter(u => line(u.line).c === state.cost);
  if (state.type) units = units.filter(u => line(u.line).t.includes(state.type));
  units = sortBy(units, state.sort);
  let html = `<div class="mtc-sort">
    <span class="lbl">Sort</span>
    ${[['avg','Best place'],['top4','Top 4'],['win','Wins'],['use','Most played']].map(([k,l]) => `<button class="chip ${state.sort===k?'on':''}" data-sort="${k}">${l}</button>`).join('')}
    <span class="sep"></span><span class="lbl">Cost</span>
    ${[1,2,3,4,5].map(c => `<button class="chip cost ${state.cost===c?'on':''}" style="--cc:var(--c${c})" data-cost="${c}">${c}</button>`).join('')}
    <span class="sep"></span>
    <select class="chip" id="typeSel" aria-label="Type filter"><option value="">Any type</option>${types.map(t => `<option value="${t}" ${state.type===t?'selected':''}>${esc(typeName(t))}</option>`).join('')}</select>
  </div>`;
  let k = 0; const dly = () => `--d:${(0.15 + Math.min(k++, 30)*0.025).toFixed(3)}s`;
  html += `<div class="tiers">` + TIERS.map((t, i) => `
    <section class="tier-row" aria-label="Tier ${t}" style="--d:${(0.1 + i*0.07).toFixed(2)}s">
      <div class="tier-cell">${tierBadge(t, true)}</div>
      <div class="tier-body">${units.filter(u => u.tier === t).map(u => `
        <button class="mtc-unit ${state.sel===u.line?'sel':''}" data-unit="${esc(u.line)}" style="${dly()}" title="${esc(lineName(u.line))} · avg ${fmt1(u.avg)}">
          ${monHtml(u.line)}
          <span class="avg">${fmt1(u.avg)}</span>
          <small>${esc(lineName(u.line))}</small>
        </button>`).join('')}</div>
    </section>`).join('') + `</div>
    <p class="tier-note">Number under the sprite = average place (1 to 8, lower is better). Border colour = cost. Sorted by ${ {avg:'best place', top4:'top 4 rate', win:'win rate', use:'usage'}[state.sort] } inside each tier.</p>`;
  return html;
}
// related comps / items for the modals
const relComps = (pred, n=5) => KT.comps.filter(c => reliable(c) && pred(c)).sort((a, b) => a.avg - b.avg).slice(0, n);
function relCompsHtml(title, list) {
  if (!list.length) return '';
  return `<div class="mtc-sec"><h4 class="mtc-h4">${title}<small>reliable samples, best first</small></h4><ul class="rel">${list.map(c => `<li role="button" tabindex="0" data-goto-comp="${esc(c.id)}">${tierBadge(c.tier)}<span class="who"><b>${compTitle(c)}</b><span class="mons">${c.units.slice(0,9).map(u => `<img src="thumb/${unitDex(u.line,u.star)||0}.webp" alt="" title="${esc(unitName(u.line,u.star))}" loading="lazy">`).join('')}</span></span><span class="rkc-pill">${fmt1(c.avg)}</span></li>`).join('')}</ul></div>`;
}
function itemsOnLine(lineId) {
  const acc = {};
  for (const c of KT.comps) { if (!reliable(c)) continue; for (const u of c.units) if (u.line === lineId) for (const i of u.items) acc[i.id] = (acc[i.id] || 0) + i.share * c.n; }
  const tot = Object.values(acc).reduce((a, b) => a + b, 0) || 1;
  return Object.entries(acc).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, w]) => ({id, p: w / tot * 100}));
}
function pokemonDetail(u, maxUse) {
  const l = line(u.line);
  const forms = l.stars.map((s, i) => `<span class="mtc-mini" title="${esc(s.name)}"><span class="mtc-stars">${stars(i+1)}</span>${monHtml(u.line, {star:i+1, size:'sm', anim:false})}</span>`).join('');
  const held = itemsOnLine(u.line);
  const comps = relComps(c => c.units.some(x => x.line === u.line && x.share >= 50));
  return `<div class="detail">
    <div class="mtc-mon big ${l.c?'c'+l.c:''}">${lineDex(u.line) ? `<img src="sd/${lineDex(u.line)}.gif" alt="">` : ''}</div>
    <div>
      <h3>${l.c ? `<span class="mtc-trait">cost ${l.c}</span>` : ''} ${l.t.map(t => `<span class="mtc-trait">${typeGlyph(t)}${esc(typeName(t))}</span>`).join('')} ${l.range ? `<span class="mtc-trait">range ${l.range}</span>` : ''}</h3>
      ${l.n.length > 1 ? `<div class="mtc-strip" style="margin:4px 0 6px">${forms}</div>` : ''}
      ${l.move ? `<p><b>${esc(l.move.name)}</b> (${esc(typeName(l.move.type))}) · ${esc(l.move.text)}</p>` : ''}
      ${l.passive ? `<p><b>${l.new35 ? 'Rules v35' : 'Passive'}</b> · ${esc(l.passive)}</p>` : ''}
      ${l.new35 ? `<p class="mtc-note">New in rules v${KT.meta.rules}: the game data file still describes v${KT.dataRules}, so the exact move text is not published yet. Shown with the standard sprite.</p>` : ''}
      ${statsHtml(u, maxUse)}
      ${u.onlyRules ? `<p class="mtc-note">Only rules v${u.onlyRules} counted for this one.</p>` : ''}
    </div>
  </div>
  ${held.length ? `<div class="mtc-sec"><h4 class="mtc-h4">Items players put on it<small>share of its item slots in reliable comps</small></h4><div class="held">${held.map(h => `<span data-goto-item="${esc(h.id)}" role="button" tabindex="0">${itemIco(h.id)}${esc(itemName(h.id))}<i>${Math.round(h.p)} %</i></span>`).join('')}</div></div>` : ''}
  ${relCompsHtml('Best comps with it', comps)}`;
}

// --- Comps ---
function viewComps() {
  const q = state.q.toLowerCase();
  let comps = KT.comps.filter(c => matches(q, compTitle(c), compUnitsNames(c), c.units.flatMap(u => u.items.map(i => itemName(i.id))).join(' '), c.traits.map(t => typeName(t.type)).join(' ')));
  if (state.tierFilter) comps = comps.filter(c => c.tier === state.tierFilter);
  const small = comps.filter(c => !reliable(c)).length;
  if (state.reliable) comps = comps.filter(reliable);
  comps = sortBy(comps, state.compSort);
  const maxUse = Math.max(...KT.comps.map(c => c.use));
  const shown = comps.slice(0, state.shown);
  let html = `<div class="mtc-sort">
    ${[['avg','Best'],['use','Most played'],['win','Most wins']].map(([k,l]) => `<button class="chip ${state.compSort===k?'on':''}" data-csort="${k}">${l}</button>`).join('')}
    <span class="sep"></span><span class="lbl">Tier</span>
    ${TIERS.map(t => `<button class="chip ${state.tierFilter===t?'on':''}" data-tier="${t}">${t}</button>`).join('')}
    <span class="sep"></span><button class="chip ${state.reliable?'':'on'}" data-reliable title="Comps under ${MIN_NE} effective games: the API only gives their 4 core units, no board detail">${state.reliable ? `Show small samples (${int(small)})` : 'Hide small samples'}</button>
    <span class="lbl" style="margin-left:auto">${int(comps.length)} comps</span>
  </div>
  <div class="mtc-list">` + shown.map((c, i) => compRow(c, maxUse, i)).join('') + `</div>`;
  if (comps.length > shown.length) html += `<div class="more-wrap"><button class="mtc-btn" data-more>Show ${Math.min(40, comps.length - shown.length)} more</button></div>`;
  return html;
}
function compRow(c, maxUse, i=0) {
  const open = state.open === c.id;
  const core = isCore(c);
  const few = !core && c.ne < MIN_NE;
  const ci = carryInfo(c);
  return `<article class="mtc-card ${open?'exp':''}" id="comp-${esc(c.id)}" style="--d:${(0.05 + Math.min(i, 12)*0.05).toFixed(2)}s">
    <button class="mtc-row" data-comp="${esc(c.id)}" aria-expanded="${open}">
      ${tierBadge(c.tier)}
      <span class="mtc-row-main">
        <span class="mtc-row-title"><h3>${compTitle(c)}</h3>${c.use >= 2 ? `<span class="mtc-pop">🔥 ${pct(c.use)}</span>` : ''}${few ? `<span class="mtc-fewtag">${int(c.ne)} games</span>` : ''}${core ? `<span class="mtc-fewtag core" title="Fewer than ${MIN_NE} games: the API only gives the 4 core units, with each unit's usual items, no stars or board">core only · ${int(c.n)} games</span>` : ''}</span>
        <span class="mtc-row-units">${c.units.map(u => { const isC = u.line === ci.main, isS = u.line === ci.sub, isH = ci.holders.has(u.line); const show = isH || (core && u.items.length); return `<span class="mtc-mini ${isC?'carry':isS?'sub':isH?'holder':''} ${core?'dim':''}">${isC ? '<span class="carry-tag">CARRY</span>' : isS ? '<span class="carry-tag sub">SUB</span>' : ''}<span class="mtc-stars">${core ? '' : stars(u.star)}</span>${monHtml(u.line, {star:u.star, size:'sm', items: show ? u.items.slice(0, isC ? 3 : 2).map(i => i.id) : null})}</span>`; }).join('')}</span>
      </span>
      <span class="mtc-row-avg"><b>${fmt1(c.avg)}</b><small>avg place</small></span>
      <span class="mtc-row-chev">${open ? '▲' : '▼'}</span>
    </button>
    ${open ? compDetail(c, maxUse, ci) : ''}
  </article>`;
}
function compDetail(c, maxUse, ci) {

  state.open = prev === id ? null : id;
  for (const cid of new Set([prev, id].filter(Boolean))) {
    const el = document.getElementById('comp-' + cid); const c = KT.comps.find(x => x.id === cid);
    if (!el || !c) continue;
    const tmp = document.createElement('div'); tmp.innerHTML = compRow(c, maxUse, 0);
    const fresh = tmp.firstElementChild; fresh.style.animation = 'none'; el.replaceWith(fresh);
  }
  if (state.open) document.getElementById('comp-' + id)?.scrollIntoView({block:'nearest', behavior:'smooth'});
  setHash();
}
const scrollToPanel = () => $('.meta-panel').scrollIntoView({behavior:'smooth', block:'start'});

$('#tabs').addEventListener('click', e => { const b = e.target.closest('[role=tab]'); if (b) { setTab(b.dataset.tab); } });
let qt; $('#search').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim(); state.shown = 40; render(); }, 120); });
function gotoComp(id) { const c = KT.comps.find(x => x.id === id); if (!c) return; closeModal();
  const sw = state.tab !== 'comps'; state.tab = 'comps'; state.open = id; state.q = ''; state.tierFilter = ''; state.compSort = 'avg'; if (!reliable(c)) state.reliable = false; $('#search').value = '';
  const idx = sortBy(KT.comps.filter(x => !state.reliable || reliable(x)), 'avg').findIndex(x => x.id === id); state.shown = Math.max(40, idx + 1); save(); render(sw); setHash();
  const el = document.getElementById('comp-' + id); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); else scrollToPanel(); }
document.addEventListener('click', e => {
  const t = e.target;
  const gu = t.closest('[data-goto-unit]'); if (gu) return openModal('pokemon', gu.dataset.gotoUnit);
  const gi = t.closest('[data-goto-item]'); if (gi) return openModal('item', gi.dataset.gotoItem);
  const gc = t.closest('[data-goto-comp]'); if (gc) return gotoComp(gc.dataset.gotoComp);
  if (!t.closest('#view')) return;
  const sortB = t.closest('[data-sort]'); if (sortB) { state.sort = sortB.dataset.sort; return render(); }
  const costB = t.closest('[data-cost]'); if (costB) { const c = +costB.dataset.cost; state.cost = state.cost === c ? 0 : c; return render(); }
  const unitB = t.closest('[data-unit]'); if (unitB) return openModal('pokemon', unitB.dataset.unit);
  const itemB = t.closest('[data-item]'); if (itemB) return openModal('item', itemB.dataset.item);
  const typeB = t.closest('[data-type]'); if (typeB) return openModal('type', typeB.dataset.type.replace(':', '-'));
  if (t.closest('[data-reliable]')) { state.reliable = !state.reliable; state.shown = 40; return render(); }
  const rb = t.closest('[data-rar]'); if (rb) { const r = +rb.dataset.rar; state.sealRar = state.sealRar === r ? 0 : r; return render(); }
  const cs = t.closest('[data-csort]'); if (cs) { state.compSort = cs.dataset.csort; state.shown = 40; return render(); }
  const tf = t.closest('[data-tier]'); if (tf) { state.tierFilter = state.tierFilter === tf.dataset.tier ? '' : tf.dataset.tier; state.shown = 40; return render(); }
  const comp = t.closest('[data-comp]'); if (comp) return toggleComp(comp.dataset.comp);
  if (t.closest('[data-more]')) { state.shown += 40; return render(); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.rank li, .rel li, .held span')) { e.preventDefault(); e.target.click(); } });

// stars on the title sky, like the game (deterministic positions)
(() => { let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647; let h = '';
  for (let i = 0; i < 48; i++) h += `<i style="left:${(rnd()*100).toFixed(1)}%;top:${(rnd()*100).toFixed(1)}%;--t:${(2.2+rnd()*3).toFixed(1)}s;--d:${(-rnd()*5).toFixed(1)}s"></i>`;
  $('#stars').innerHTML = h; })();

async function boot() {
  try {
    const r = await fetch('data.json', {cache: 'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    KT = await r.json();
  } catch (err) {
    $('#view').innerHTML = `<div class="err">Could not load the Meta data (${esc(err.message)}). Reload the page to try again.</div>`;
    return;
  }
  for (const list of [KT.units, KT.items, KT.traits]) for (const x of list) x.tier = tierOf(x);
  for (const c of KT.comps) { c.apiTier = c.tier; c.tier = compTier(c); }
  buildTypicalCells();
  renderShell();
  applyHash(true);
}
boot();
})();
</script>
</body>
